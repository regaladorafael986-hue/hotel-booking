<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password — StayEase</title>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script type="module" src="/assets/js/pages/auth.js"></script>
</head>
<body class="site" data-page="reset">
  <div class="auth-page">
    <aside class="auth-side">
      <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=1400&q=75')"></div>
      <a class="brand" href="/index.html"><span class="brand-mark" aria-hidden="true">S</span><span class="brand-name">StayEase<small>Hotel &amp; Suites</small></span></a>
      <blockquote>“Unhurried stays in the heart of the city.”</blockquote>
    </aside>
    <main class="auth-main" id="main">
      <div class="auth-card">
        <h1>Choose a new password</h1>
        <p class="muted">For your security, this link can only be used once.</p>
        <div id="notice"></div>
        <form id="form" class="stack mt-3" novalidate>
          <div class="field"><label for="password">New password</label><input id="password" class="input" type="password" name="password" autocomplete="new-password" required minlength="8" maxlength="128" data-password data-meter><div class="hint">At least 8 characters with a letter and a number.</div><div class="field-error"></div></div>
          <div class="field"><label for="confirm">Confirm new password</label><input id="confirm" class="input" type="password" name="confirm_password" autocomplete="new-password" required data-password><div class="field-error"></div></div>
          <button class="btn btn-lg btn-block" type="submit">Update password</button>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
