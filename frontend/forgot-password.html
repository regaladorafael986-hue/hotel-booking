<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password — StayEase</title>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script type="module" src="/assets/js/pages/auth.js"></script>
</head>
<body class="site" data-page="forgot">
  <div class="auth-page">
    <aside class="auth-side">
      <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=1400&q=75')"></div>
      <a class="brand" href="/index.html"><span class="brand-mark" aria-hidden="true">S</span><span class="brand-name">StayEase<small>Hotel &amp; Suites</small></span></a>
      <blockquote>“Unhurried stays in the heart of the city.”</blockquote>
    </aside>
    <main class="auth-main" id="main">
      <div class="auth-card">
        <h1>Reset your password</h1>
        <p class="muted">Enter your email and we will send you a reset link.</p>
        <div id="notice"></div>
        <form id="form" class="stack mt-3" novalidate>
          <div class="field"><label for="email">Email</label><input id="email" class="input" type="email" name="email" autocomplete="email" required maxlength="191"><div class="field-error"></div></div>
          <button class="btn btn-lg btn-block" type="submit">Send reset link</button>
        </form>
        <p class="switch"><a href="/login.html">Back to log in</a></p>
      </div>
    </main>
  </div>
</body>
</html>
